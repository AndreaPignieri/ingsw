server {
    listen 80;
    server_name dietiestates25.cloud www.dietiestates25.cloud;
    
    # Redirect all HTTP traffic to HTTPS associated with the same host
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dietiestates25.cloud www.dietiestates25.cloud;

    ssl_certificate /etc/letsencrypt/live/dietiestates25.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dietiestates25.cloud/privkey.pem;

    client_max_body_size 10M;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files directly
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy OAuth2 requests to the backend (preserves path)
    location /oauth2/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Proxy OAuth2 login callbacks to the backend (preserves path)
    location /login/oauth2/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://app:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}