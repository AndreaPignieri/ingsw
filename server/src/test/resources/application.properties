# Test Configuration
server.port=0
spring.main.banner-mode=off

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Hibernate Configuration
spring.sql.init.mode=never
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Security
application.security.jwt.secret-key=NDI0MjQyNDI0MjQyNDI0MjQyNDI0MjQyNDI0MjQyNDI=

# OAuth2 Configuration (Mocks)
spring.security.oauth2.client.registration.google.client-id=mock-google-id
spring.security.oauth2.client.registration.google.client-secret=mock-google-secret
spring.security.oauth2.client.registration.google.scope=profile, email

spring.security.oauth2.client.registration.facebook.client-id=mock-facebook-id
spring.security.oauth2.client.registration.facebook.client-secret=mock-facebook-secret
spring.security.oauth2.client.registration.facebook.scope=public_profile

spring.security.oauth2.client.registration.github.client-id=mock-github-id
spring.security.oauth2.client.registration.github.client-secret=mock-github-secret
spring.security.oauth2.client.registration.github.scope=user:email

# Storage Configuration
storage.type=local

# AWS Mocks (Required even if storage.type=local because beans might still be initialized or checked)
aws.access.key.id=mock-access-key
aws.secret.access.key=mock-secret-key
aws.s3.region=us-east-1
aws.s3.bucket=mock-bucket
